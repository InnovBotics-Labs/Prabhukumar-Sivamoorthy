apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything lands in its own namespace so it is easy to inspect or tear down:
#   kubectl -n portfolio get all
#   kubectl delete -k k8s/base
namespace: portfolio

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: prabhukumar-sivamoorthy

# The ONE place to point at your registry. Replace REGION / PROJECT_ID / REPO
# with the Artifact Registry values from k8s/README.md step 1, e.g.
#   us-central1-docker.pkg.dev/my-gcp-project/portfolio/portfolio
# Pin newTag to a commit SHA for exact rollouts, or leave "latest" and use
#   kubectl -n portfolio rollout restart deploy/portfolio
images:
  - name: portfolio
    newName: REGION-docker.pkg.dev/PROJECT_ID/REPO/portfolio
    newTag: latest
