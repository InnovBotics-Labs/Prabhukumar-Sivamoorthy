name: Build and push image

# Builds the Docker image and pushes it to Google Artifact Registry on every
# push to the deploy branch. Rolling it out to the cluster is a manual
# `kubectl` step for now (see k8s/README.md step 7).
#
# Repository settings needed (Settings -> Secrets and variables -> Actions):
#   Variables: GCP_PROJECT_ID, GAR_REGION (e.g. us-central1), GAR_REPOSITORY
#   Secret:    GCP_SA_KEY  (JSON key of a service account with
#              roles/artifactregistry.writer)

on:
  push:
    branches: [Portfolio_AD]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.GAR_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/portfolio

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Plain Docker login with the JSON key; no gcloud needed.
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GAR_REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image pushed
        run: |
          echo "Pushed ${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed ${IMAGE}:latest"        >> "$GITHUB_STEP_SUMMARY"
