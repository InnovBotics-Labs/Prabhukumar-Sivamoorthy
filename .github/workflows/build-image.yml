name: Build and push image

# Builds the Docker image and pushes it to GitHub Container Registry (GHCR) on
# every push to the deploy branch. Rolling it out to the cluster is a manual
# `kubectl` step (see k8s/README.md step 5).
#
# No secrets to configure: the job authenticates with the built-in GITHUB_TOKEN.
# After the FIRST push, set the package's visibility to Public once
# (repo -> Packages -> prabhukumar-sivamoorthy -> Package settings) so the
# cluster can pull it without credentials.

on:
  push:
    branches: [Portfolio_AD]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces ghcr.io/innovbotics-labs/prabhukumar-sivamoorthy (lowercased
      # automatically) tagged with the commit SHA and latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image pushed
        run: |
          echo "Pushed tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
